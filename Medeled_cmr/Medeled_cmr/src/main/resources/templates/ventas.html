<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ventas - MEDELED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">MEDELED</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/clientes">Clientes / PQRS</a>
                <a class="nav-link" href="/ventas">Ventas</a>
            </div>
        </div>
    </nav>
    <div class="container my-4">
        <h1>Ventas</h1>

        <form method="post" th:action="@{/ventas}" class="row g-2 mb-4">
            <div class="col-6 col-md-2"><input class="form-control" type="number" name="idCliente" placeholder="Id cliente" required="required"/></div>
            <div class="col-12 col-md-3"><input class="form-control" type="text" name="producto" placeholder="Producto" required="required"/></div>
            <div class="col-6 col-md-2"><input class="form-control" type="number" name="cantidad" placeholder="Cantidad" required="required"/></div>
            <div class="col-6 col-md-2"><input class="form-control" type="number" step="0.01" name="precioUnitario" placeholder="Precio unitario" required="required"/></div>
            <div class="col-6 col-md-2"><input class="form-control" type="date" name="fechaVenta" required="required"/></div>
            <div class="col-6 col-md-2">
                <select class="form-select" name="estado" required="required">
                    <option value="pendiente">Pendiente</option>
                    <option value="entregado">Entregado</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <div class="col-12"><button class="btn btn-success" type="submit">Registrar venta</button></div>
        </form>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr><th>Id</th><th>Cliente</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Fecha</th><th>Estado</th></tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${ventas}">
                        <td th:text="${v.idVenta}"></td>
                        <td th:text="${v.idCliente}"></td>
                        <td th:text="${v.producto}"></td>
                        <td th:text="${v.cantidad}"></td>
                        <td th:text="${v.precioUnitario}"></td>
                        <td th:text="${v.fechaVenta}"></td>
                        <td th:text="${v.estado}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
