<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes - MEDELED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">MEDELED</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/clientes">Clientes / PQRS</a>
                <a class="nav-link" href="/ventas">Ventas</a>
            </div>
        </div>
    </nav>
    <div class="container my-4">
        <h1>Clientes / PQRS</h1>

        <form method="post" th:action="@{/clientes}" class="row g-2 mb-4">
            <div class="col-12 col-md-4"><input class="form-control" type="text" name="nombre" placeholder="Nombre" required="required"/></div>
            <div class="col-12 col-md-4"><input class="form-control" type="text" name="producto" placeholder="Producto" required="required"/></div>
            <div class="col-6 col-md-2"><input class="form-control" type="date" name="fechaCompra" required="required"/></div>
            <div class="col-6 col-md-2">
                <select class="form-select" name="estado" required="required">
                    <option value="pendiente">Pendiente</option>
                    <option value="en proceso">En proceso</option>
                    <option value="resuelto">Resuelto</option>
                </select>
            </div>
            <div class="col-12"><input class="form-control" type="text" name="observaciones" placeholder="Observaciones"/></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Registrar</button></div>
        </form>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr><th>Id</th><th>Nombre</th><th>Producto</th><th>Fecha</th><th>Estado</th><th>Observaciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.idCliente}"></td>
                        <td th:text="${c.nombre}"></td>
                        <td th:text="${c.producto}"></td>
                        <td th:text="${c.fechaCompra}"></td>
                        <td th:text="${c.estado}"></td>
                        <td th:text="${c.observaciones}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
